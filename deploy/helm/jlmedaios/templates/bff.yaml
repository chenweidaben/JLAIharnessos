apiVersion: v1
kind: ServiceAccount
metadata:
  name: jlmedaios-bff
  namespace: {{ include "jlmedaios.namespace" . }}
  labels:
    {{- include "jlmedaios.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: {{ include "jlmedaios.namespace" . }}
  labels:
    app.kubernetes.io/name: bff
    {{- include "jlmedaios.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: bff
  ports:
    - name: http
      port: {{ .Values.bff.containerPort }}
      targetPort: {{ .Values.bff.containerPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: {{ include "jlmedaios.namespace" . }}
  labels:
    app.kubernetes.io/name: bff
    {{- include "jlmedaios.labels" . | nindent 4 }}
spec:
  {{- if not .Values.bff.hpa.enabled }}
  replicas: {{ .Values.bff.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff
        {{- include "jlmedaios.labels" . | nindent 8 }}
    spec:
      serviceAccountName: jlmedaios-bff
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bff
          image: {{ include "jlmedaios.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: jlmedaios-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "jlmedaios.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "jlmedaios.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "jlmedaios.secretName" . }}
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "jlmedaios.secretName" . }}
                  key: JWT_SECRET
            - name: ENCRYPTION_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "jlmedaios.secretName" . }}
                  key: ENCRYPTION_MASTER_KEY
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0"
          ports:
            - name: http
              containerPort: {{ .Values.bff.containerPort }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.bff.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.bff.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.bff.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- if .Values.bff.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bff
  namespace: {{ include "jlmedaios.namespace" . }}
  labels:
    app.kubernetes.io/name: bff
    {{- include "jlmedaios.labels" . | nindent 4 }}
spec:
  {{- if .Values.bff.pdb.minAvailable }}
  minAvailable: {{ .Values.bff.pdb.minAvailable }}
  {{- else if .Values.bff.pdb.maxUnavailable }}
  maxUnavailable: {{ .Values.bff.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
{{- end }}
{{- if .Values.bff.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bff
  namespace: {{ include "jlmedaios.namespace" . }}
  labels:
    app.kubernetes.io/name: bff
    {{- include "jlmedaios.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bff
  minReplicas: {{ .Values.bff.hpa.minReplicas }}
  maxReplicas: {{ .Values.bff.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.bff.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.bff.hpa.targetMemoryUtilizationPercentage }}
{{- end }}
