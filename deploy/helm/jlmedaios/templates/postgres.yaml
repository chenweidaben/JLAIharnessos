{{- if .Values.internal.postgres.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ include "jlmedaios.namespace" . }}
  labels:
    app.kubernetes.io/name: postgres
    {{- include "jlmedaios.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ include "jlmedaios.namespace" . }}
  labels:
    app.kubernetes.io/name: postgres
    {{- include "jlmedaios.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        {{- include "jlmedaios.labels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.internal.postgres.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "jlmedaios.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "jlmedaios.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: {{ include "jlmedaios.pgDatabase" . | quote }}
            - name: TZ
              value: {{ .Values.app.timezone | quote }}
          ports:
            - name: tcp-postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", {{ include "jlmedaios.pgDatabase" . | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", {{ include "jlmedaios.pgDatabase" . | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.internal.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          {{- include "jlmedaios.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.internal.postgres.storageClass }}
        storageClassName: {{ .Values.internal.postgres.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.internal.postgres.storage | quote }}
{{- end -}}
