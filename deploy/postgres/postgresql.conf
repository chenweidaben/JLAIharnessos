# ============================================================================
# 健澜科技杠OS - PostgreSQL 16 生产配置（容器化）
# 挂载：/etc/postgresql/postgresql.conf
# 说明：内存相关参数给出容器默认值与按规格调整建议；部署到生产请按实例 vCPU/内存
#       通过额外 -c 覆盖或自定义配置文件，不要直接把分析型参数写死进镜像。
# Copyright (c) 2026 健澜科技. Licensed under Apache-2.0.
# ============================================================================

# ---- 连接 ----
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 5
tcp_keepalives_idle = 300
tcp_keepalives_interval = 30

# ---- 区域 ----
timezone = 'Asia/Shanghai'
log_timezone = 'Asia/Shanghai'
lc_messages = 'C'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.simple'

# ---- 认证与安全 ----
password_encryption = 'scram-sha-256'
ssl = off                                  # 生产建议开启：挂载 TLS 证书后置 on
# ssl_cert_file = '/var/lib/postgresql/certs/server.crt'
# ssl_key_file  = '/var/lib/postgresql/certs/server.key'
row_security = on

# ---- 内存（容器默认 2C4G 参考值，按规格调整）----
shared_buffers = 1GB                      # 建议物理内存 1/4
effective_cache_size = 3GB                # 建议物理内存 3/4
work_mem = 16MB
maintenance_work_mem = 256MB
huge_pages = try
dynamic_shared_memory_type = posix

# ---- 检查点与 WAL ----
wal_buffers = 16MB
checkpoint_timeout = 10min
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# ---- WAL 归档 / PITR（归档到独立卷 /wal-archive）----
archive_mode = on
archive_command = 'test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
wal_level = replica
archive_timeout = 300s                     # 最多 5 分钟切一段 WAL，降低丢失窗口

# ---- 查询计划 ----
random_page_cost = 1.1                     # 容器云盘/SSD
effective_io_concurrency = 200
default_statistics_target = 100

# ---- 自动清理 ----
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ---- 日志（含审计所需要素）----
logging_collector = off                    # 容器场景直接输出到 stdout，由 Docker 收集
log_destination = 'stderr'
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %u@%d app=%a client=%h pid=%p txid=%x '
log_statement = 'ddl'                      # 记录 DDL；DML 审计走应用 audit 表，避免全量日志含敏感数据
log_min_duration_statement = 1000          # 超过 1s 的慢查询记录
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1000

# ---- 复制/高可用（主从时启用，见部署文档）----
# max_wal_senders = 10
# max_replication_slots = 10
# hot_standby = on

# ---- 客户端语句（防止误操作长事务）----
idle_in_transaction_session_timeout = 300000
lock_timeout = 10000
statement_timeout = 0                      # 由应用侧控制；分析型只读副本可设 60s
