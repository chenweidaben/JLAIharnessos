# ============================================================================
# 健澜科技杠OS - PostgreSQL 客户端认证（参考）
#
# docker-compose 默认使用镜像内置 pg_hba（容器内网 + SCRAM 密码）。
# 当使用自定义镜像、宿主机直连或启用 TLS 时，将本文件挂载到
#   /var/lib/postgresql/data/pg_hba.conf （或 postgresql.conf 中 hba_file 指定路径）
#
# 原则：最小权限、内网限定、生产强制 SCRAM/TLS，禁止全网 trust。
# Copyright (c) 2026 健澜科技. Licensed under Apache-2.0.
# ============================================================================

# TYPE  DATABASE   USER      ADDRESS            METHOD

# 本地 socket（容器内维护/备份）
local   all        all                          peer

# 容器内网（backend 网络）：SCRAM 密码认证
host    all        all       127.0.0.1/32       scram-sha-256
host    all        all       172.16.0.0/12      scram-sha-256
host    all        all       10.0.0.0/8         scram-sha-256

# 生产启用 TLS 后，改为 hostssl 并拒绝明文 host：
# hostssl all       all       0.0.0.0/0          scram-sha-256
# hostnossl all     all       0.0.0.0/0          reject

# 复制账号（流复制，限定备库地址）
# local  replication replicator                 peer
# host   replication replicator 10.0.0.0/12      scram-sha-256

# 默认拒绝其他一切
host    all        all       0.0.0.0/0          reject
host    all        all       ::/0               reject
