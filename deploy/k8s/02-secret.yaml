# ============================================================================
# 健澜科技杠OS — 敏感配置（Secret）
#
# 警告：以下为占位值，仅用于首次部署联调。生产环境必须替换为强随机值：
#   ① 推荐：External Secrets / Sealed Secrets / Vault 对接，不在 Git 中存明文；
#   ② 手动：kubectl -n jlmedaios create secret generic jlmedaios-secret \
#        --from-literal=POSTGRES_PASSWORD='...' --from-literal=JWT_SECRET='...' \
#        --from-literal=ENCRYPTION_MASTER_KEY='...' --from-literal=REDIS_PASSWORD='...'
#
# 使用 stringData 以便人工核对，K8s 会在落库时自动 base64 编码。
#
# Copyright (c) 2026 健澜科技. Licensed under Apache-2.0.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: jlmedaios-secret
  namespace: jlmedaios
  labels:
    app.kubernetes.io/part-of: jlmedaios
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "change-me-pg-password"
  REDIS_PASSWORD: "change-me-redis-password"
  JWT_SECRET: "change-me-jwt-secret-min-32-chars"
  ENCRYPTION_MASTER_KEY: "change-me-encryption-master-key"
