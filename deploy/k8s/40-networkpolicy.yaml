# ============================================================================
# 健澜科技杠OS — NetworkPolicy（零信任网络隔离）
#
# 默认拒绝所有入站，再按调用关系显式放行；出站统一放行 DNS，BFF 额外放行
# 外部出站（调用大模型 API）。需 CNI 支持 NetworkPolicy（Calico/Cilium 等）。
#
# 调用链：
#   ingress-nginx → web → bff → postgres / redis
#
# Copyright (c) 2026 健澜科技. Licensed under Apache-2.0.
# ============================================================================

# 1) 默认拒绝所有 Pod 的入站流量
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: jlmedaios
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# 2) 所有 Pod 允许 DNS 出站（kube-system 的 CoreDNS）
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: jlmedaios
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# 3) Web：允许 ingress-nginx 命名空间入站
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress
  namespace: jlmedaios
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

# 4) BFF：允许 Web 入站；出站放行集群内（postgres/redis）与外网（LLM）
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff-ingress
  namespace: jlmedaios
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bff
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # 允许访问集群内任意地址（postgres/redis Service）
    - to:
        - podSelector: {}
    # 允许外部出站（大模型 API、影像推理等）
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0

# 5) PostgreSQL：仅允许 BFF 入站
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: jlmedaios
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
      ports:
        - protocol: TCP
          port: 5432

# 6) Redis：仅允许 BFF 入站
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: jlmedaios
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
      ports:
        - protocol: TCP
          port: 6379
