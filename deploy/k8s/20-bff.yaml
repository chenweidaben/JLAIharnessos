# ============================================================================
# 健澜科技杠OS — BFF 后端（Deployment + Service + HPA + PDB + ServiceAccount）
#
# 多副本无状态，水平自动扩缩；启动时自动迁移（多副本并发由迁移表幂等保证）。
#
# Copyright (c) 2026 健澜科技. Licensed under Apache-2.0.
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jlmedaios-bff
  namespace: jlmedaios
  labels:
    app.kubernetes.io/part-of: jlmedaios
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: jlmedaios
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: jlmedaios
spec:
  selector:
    app.kubernetes.io/name: bff
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: jlmedaios
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: jlmedaios
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff
        app.kubernetes.io/part-of: jlmedaios
    spec:
      serviceAccountName: jlmedaios-bff
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bff
          image: registry.jianlan.tech/jianlan/backend:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: jlmedaios-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jlmedaios-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jlmedaios-secret
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jlmedaios-secret
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jlmedaios-secret
                  key: JWT_SECRET
            - name: ENCRYPTION_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: jlmedaios-secret
                  key: ENCRYPTION_MASTER_KEY
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bff
  namespace: jlmedaios
  labels:
    app.kubernetes.io/part-of: jlmedaios
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bff
  namespace: jlmedaios
  labels:
    app.kubernetes.io/part-of: jlmedaios
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bff
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
