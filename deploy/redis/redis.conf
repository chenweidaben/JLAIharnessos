# ============================================================================
# 健澜科技杠OS - Redis 7 生产配置
# 挂载：/usr/local/etc/redis/redis.conf
# 密码由 compose 命令行 --requirepass 注入（不写入配置文件，避免入库泄露）
# Copyright (c) 2026 健澜科技. Licensed under Apache-2.0.
# ============================================================================

# ---- 网络 ----
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300
daemonize no
supervised no

# ---- 通用 ----
loglevel notice
# 数据库仅用 0 号，简化多环境一致性
databases 16
always-show-logo no

# ---- 内存与淘汰 ----
# 生产按容器内存限制设置，例如 maxmemory 2gb；此处给出策略，容量由部署侧限定。
# 仅淘汰带 TTL 的键，保护无 TTL 的关键数据；缓存/锁/会话均设置了 TTL。
maxmemory-policy volatile-lru
maxmemory-samples 5

# ---- 慢查询 ----
slowlog-log-slower-than 10000        # 10ms（微秒）
slowlog-max-len 128
latency-monitor-threshold 100

# ---- 客户端缓冲 ----
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ---- 频率 ----
hz 10
dynamic-hz yes

# ---- RDB 快照（/data 为持久化卷）----
dir /data
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
stop-writes-on-bgsave-error yes

# ---- AOF（更强持久性，everysec 兼顾性能与安全）----
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# ---- 键空间通知（可选：过期事件，用于本地缓存联动）----
notify-keyspace-events Ex

# ---- 安全：禁用/重命名高危命令 ----
# 应用仅使用常规命令与 EVAL（受控 Lua）、SCAN（不使用 KEYS）。
rename-command KEYS ""
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
# CONFIG 建议生产环境也重命名；如确需运行时调参，请改为强随机值：
# rename-command CONFIG "CONFIG_a3f9c2e1"
