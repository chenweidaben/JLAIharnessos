# ============================================================================
# 健澜科技杠OS — 边缘网关：浏览器安全响应头片段（server/location 上下文）
# ----------------------------------------------------------------------------
# 所有 add_header 均带 always：对 4xx/5xx 错误响应同样下发，避免错误页成为
# 安全头缺失的突破口。注意 nginx 的 add_header 继承规则：子级一旦出现任何
# add_header，父级全部失效，因此需要安全头的 location 必须自行 include 本片段。
# ============================================================================

# HSTS：强制浏览器在 2 年（6307200 秒）内仅通过 HTTPS 访问本站及所有子域，
# 并申请浏览器 preload 列表。仅在确认全站 HTTPS 后开启；includeSubDomains
# 需确保所有子域均已支持 HTTPS，否则会导致子域不可访问。
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# CSP：默认只信任同源；style 允许内联（Ant Design 运行时样式需要）；
# img 允许 data/blob（前端图表/缩略图）；connect 允许同源 wss（对话流）。
# 严禁 unsafe-eval 与不可信 CDN；如接入监控 JS SDK，需在此显式增加来源并评审。
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:" always;

# 禁止任意站点 iframe 嵌套本站（防点击劫持）；CSP frame-ancestors 的兼容兜底。
add_header X-Frame-Options "SAMEORIGIN" always;

# 禁止浏览器 MIME 嗅探，防止上传内容被当作可执行脚本解释。
add_header X-Content-Type-Options "nosniff" always;

# Referrer 仅在同源下完整发送，跨域只发 origin，降级 HTTPS→HTTP 不发送。
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 最小化浏览器能力授权：摄像头/麦克风/定位/支付/USB/兴趣队列全部禁用。
add_header Permissions-Policy
    "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;

# 跨源隔离：防止被跨标签页共享浏览上下文（ Spectre 类侧信道缓解）。
add_header Cross-Origin-Opener-Policy "same-origin" always;

# 关闭对旧版 IE XSS Auditor 的依赖（现代浏览器由 CSP 负责）。
add_header X-XSS-Protection "1; mode=block" always;

# 隐藏 nginx 版本（server_tokens off 在主配置已设置，此处不下发 Server 版本细节）。
# 下载类响应默认不被当作导航文档，降低内容嗅探与钓鱼面。
add_header X-Download-Options "noopen" always;
