# ============================================================================
# 健澜科技杠OS — 边缘网关：TLS 通用片段（server 上下文，在 443 server 内 include）
# ----------------------------------------------------------------------------
# 证书文件由部署侧挂载到 /etc/nginx/certs（compose 生产覆盖文件中以只读绑定
# 挂载 ${TLS_CERT_DIR}），镜像内不包含任何私钥：
#   tls.crt  服务器证书 + 中间证书（完整链，OCSP stapling 依赖中间链）
#   tls.key  对应私钥（容器内只读，节点权限建议 0400 root:root）
# 开发自测可用 scripts/tls/gen-dev-cert.sh 生成自签名证书（禁止用于生产）。
# ============================================================================

# 证书与私钥（固定路径，由运维通过 Secret/挂载注入，严禁写进镜像或仓库）。
ssl_certificate     /etc/nginx/certs/tls.crt;
ssl_certificate_key /etc/nginx/certs/tls.key;

# 仅启用 TLS1.2 与 TLS1.3：禁用 TLS1.0/1.1（PCI-DSS 与等保 2.0 三级要求）。
ssl_protocols TLSv1.2 TLSv1.3;

# TLS1.2 加密套件：仅前向保密（ECDHE）、仅 AEAD（GCM/CHACHA20），禁用 CBC/RC4/3DES。
# TLS1.3 套件由 OpenSSL 内置（TLS_AES_256_GCM_SHA384 等），不在此字符串内。
ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

# TLS1.3 下由客户端偏好决定套件顺序；TLS1.2 由服务端选择更强套件。
ssl_prefer_server_ciphers off;

# ECDHE 椭圆曲线优先序：X25519 性能最好，secp384r1 满足合规审计要求。
ssl_ecdh_curve X25519:secp384r1:secp256r1;

# 会话复用：使用共享内存缓存（20MB 约 8 万会话），关闭票据（tickets 前向保密弱）。
ssl_session_cache   shared:SSL:20m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling：由网关代客户端向 CA 查询证书吊销状态并随握手下发，
# 既保护客户隐私又加快握手；必须提供完整证书链且 resolver 可达。
ssl_stapling        on;
ssl_stapling_verify on;
# 国内环境优先使用可信公共 DNS 解析 OCSP 应答器域名；valid 为缓存时长。
resolver 114.114.114.114 223.5.5.5 valid=300s ipv6=off;
resolver_timeout 5s;

# 握手阶段不把根证书链重复下发（根由客户端信任库自带），减小握手体积。
ssl_trusted_certificate /etc/nginx/certs/tls.crt;
