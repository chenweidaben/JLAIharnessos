# ============================================================================
# 健澜科技杠OS — 边缘网关：反向代理通用片段（location 上下文）
# ----------------------------------------------------------------------------
# 在反代后端 BFF（app_backend）的 location 中 include 本片段，统一：
#   - HTTP/1.1 + 连接池复用（配合 upstream 的 keepalive）；
#   - 真实访问信息透传（Host / XFF / 协议 / 请求追踪号）；
#   - WebSocket 升级；
#   - 故障转移与超时基线；
#   - SSE 流式响应关闭缓冲。
# 具体 location 仍需自行声明 proxy_pass 与差异化的超时/限流。
# ============================================================================

# upstream keepalive 要求反代使用 HTTP/1.1 并清空 Connection（map 已处理升级）。
proxy_http_version 1.1;

# 透传主机名与链路信息：
#   Host              保留原始域名，后端可据此做多租户/鉴权域判断；
#   X-Real-IP         直连客户端（real_ip 还原后即为真实访客）；
#   X-Forwarded-For  追加代理链；
#   X-Forwarded-Proto 原始协议（http/https），后端据此生成安全回调链接；
#   X-Request-Id      nginx 生成的请求唯一号，作为全链路 trace_id 透传。
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-Id      $request_id;

# WebSocket 升级头（普通 HTTP 请求下 $connection_upgrade 为空，自动走 keepalive）。
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# 连接建立超时 5 秒（内网同可用区应毫秒级，5 秒已足够容忍抖动）。
proxy_connect_timeout 5s;

# 上游故障转移：连接错误/超时/502/503/504 时尝试下一个后端实例，最多 2 次，
# 避免单副本抖动直接对外报错；幂等性由后端保证（非幂等写接口失败不自动重试）。
proxy_next_upstream        error timeout http_502 http_503 http_504;
proxy_next_upstream_tries  2;
proxy_next_upstream_timeout 10s;

# 限制后端响应中 Set-Cookie 之外的内部头透传问题由默认行为处理；
# 显式声明允许重定向跨端口时保留原始 Location（同源部署通常不需要改写）。
proxy_redirect off;

# AI 对话为 Server-Sent Events/分块流式输出：必须关闭缓冲，token 才能实时下发。
proxy_buffering off;
proxy_request_buffering off;

# 默认不缓存后端动态响应（静态资源由前端容器负责强缓存）。
proxy_cache off;
