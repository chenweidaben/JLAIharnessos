# ============================================================================
# 健澜科技杠OS — 边缘网关：限流与连接数控制区（http 上下文片段）
# ----------------------------------------------------------------------------
# limit_req_zone 仅能在 http 上下文定义「共享内存区」，在 location 中通过
# limit_req 引用。所有计数保存在共享内存（slab），nginx reload 不丢失、
# 多 worker 之间共享。
#
# 速率换算说明（leaky bucket 令牌按平均速率匀速注入）：
#   rate=20r/s  → 平均每秒 20 个请求，单 IP 约 1200 req/min；
#   rate=5r/m   → 每分钟 5 个请求，用于登录等敏感入口防爆破。
# burst/nodelay 在具体 location 的 limit_req 指令上配置。
# ============================================================================

# ----------------------------------------------------------------------------
# 全局限流：按真实客户端 IP，20MB 区约可保存 32 万个 IP 状态（每状态约 64B），
# 平均 20 req/s，覆盖正常浏览与接口轮询；突发由 location 的 burst 消化。
# ----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=req_general:20m rate=20r/s;

# ----------------------------------------------------------------------------
# 登录/鉴权限流：独立小区，平均 5 req/min（约每 12 秒 1 次）。
# 配合 location 中较小的 burst=5 nodelay，超出立即 503，阻断密码喷洒与撞库。
# ----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=req_login:10m rate=5r/m;

# ----------------------------------------------------------------------------
# AI 对话接口限流：流式对话消耗大模型算力，按 IP 限制平均 2 req/s，
# 突发 burst 在 location 配置，防止单客刷接口导致算力成本失控。
# ----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=req_chat:10m rate=2r/s;

# ----------------------------------------------------------------------------
# 并发连接数限制：按 IP 限制同时处于活跃状态的连接数（含长连接/WebSocket）。
# 10MB 区约 16 万 IP；单 IP 50 并发对正常浏览器（6~12 连接/域名）足够，
# 可拦截慢速连接攻击（Slowloris）与简单 CC。
# ----------------------------------------------------------------------------
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# ----------------------------------------------------------------------------
# 被限流时的返回：429 Too Many Requests（默认是 503，语义不准确）。
# 限流响应不打访问日志（limit_req_log_level 控制错误日志级别）。
# ----------------------------------------------------------------------------
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;
