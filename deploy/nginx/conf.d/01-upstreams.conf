# ============================================================================
# 健澜科技杠OS — 边缘网关：上游服务与连接升级映射（http 上下文片段）
# ----------------------------------------------------------------------------
# 本文件由主配置 deploy/nginx/nginx.conf 在 http {} 内 include：
#   include /etc/nginx/conf.d/01-upstreams.conf;
# 仅包含 http 上下文允许的指令（upstream / map），不可包含 server 段指令。
# ============================================================================

# ----------------------------------------------------------------------------
# 后端 BFF 上游（健澜科技杠OS 业务接口）
#   least_conn：最少活跃连接数负载均衡，适合请求耗时差异较大的 AI 对话/聚合接口；
#   max_fails/fail_timeout：15 秒窗口内失败 3 次则临时摘除 30 秒（fail_timeout
#       同时是「摘除时长」与「统计窗口」），实现被动健康检查；
#   keepalive：到上游保持 64 条空闲长连接，避免每请求三次握手、显著降低尾延迟；
#       配合 location 中的 proxy_http_version 1.1 + 清空 Connection 头生效。
#
# 多实例部署方式（二选一）：
#   1) docker compose up -d --scale app=3：
#      Docker 内嵌 DNS（127.0.0.11）对服务名 app 返回多个副本 IP，nginx 启动时
#      会把全部 A 记录加入 upstream 并按 least_conn 分发；扩容后执行
#      `docker exec nginx nginx -s reload` 即可重新解析。
#   2) 固定多实例（K8s/裸机）：显式列出 server，例如：
#        server app-2:8080 max_fails=3 fail_timeout=15s;
#        server app-3:8080 max_fails=3 fail_timeout=15s;
# ----------------------------------------------------------------------------
upstream app_backend {
    least_conn;
    server app:8080 max_fails=3 fail_timeout=15s;
    # server app-2:8080 max_fails=3 fail_timeout=15s;
    # server app-3:8080 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

# ----------------------------------------------------------------------------
# 前端静态站点上游（web 容器集群）
#   静态请求耗时极短，同样使用 least_conn 与长连接池（32 条足够）。
# ----------------------------------------------------------------------------
upstream web_frontend {
    least_conn;
    server web:8080 max_fails=3 fail_timeout=15s;
    # server web-2:8080 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# ----------------------------------------------------------------------------
# WebSocket 连接升级映射
#   客户端带 Upgrade: websocket 时，转发给上游的 Connection 置为 upgrade；
#   普通 HTTP 请求置空，使 keepalive 长连接得以复用。
# ----------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ----------------------------------------------------------------------------
# 限流键值中的真实客户端地址
#   边缘网关之前若还有 LVS/SLB，$remote_addr 是负载均衡器地址，
#   经 03-realip.conf 的 real_ip 模块还原后，$binary_remote_addr 即为真实访客，
#   从而保证 limit_req/limit_conn 按真实访客维度生效。
# ----------------------------------------------------------------------------
