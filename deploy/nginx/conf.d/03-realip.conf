# ============================================================================
# 健澜科技杠OS — 边缘网关：真实客户端 IP 还原（http 上下文片段）
# ----------------------------------------------------------------------------
# 部署形态：外网 SLB/LVS → 边缘 nginx → 内网服务。
# 若不还原真实 IP，nginx 看到的 $remote_addr 永远是 SLB 的地址，
# 限流、审计、WAF 都会失效。real_ip 模块按「可信代理网段」逐级回退 XFF，
# 最终得到最右侧一个非可信地址，即真实访客 IP。
#
# 172.16.0.0/12 覆盖 Docker 默认网桥与自建 compose 网络网段（172.16~172.31）；
# 10.0.0.0/8、192.168.0.0/16 覆盖常见内网 SLB/双活网段。
# 生产环境应按机房真实 SLB 网段收敛，不要无条件信任任意来源的 XFF。
# ============================================================================

# 从 X-Forwarded-For 中取真实地址（real_ip_recursive 开启后自右向左跳过可信跳）。
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
# 本机回环（sidecar/主机网络模式下的代理）。
set_real_ip_from 127.0.0.1/32;
set_real_ip_from ::1/128;

real_ip_header    X-Forwarded-For;
real_ip_recursive on;
