# ============================================================================
# 健澜科技杠OS — 边缘网关 Nginx 完整配置（生产入口）
# ----------------------------------------------------------------------------
# 部署位置：所有外部流量的唯一入口（容器名 nginx，镜像由 deploy/nginx/Dockerfile
#           构建，基于官方非特权镜像 nginxinc/nginx-unprivileged，uid=101）。
#
# 端口约定（容器内非特权端口，宿主机映射 80→8080、443→8443）：
#   8080/tcp  明文入口：仅做 ① HTTP→HTTPS 301 跳转；② ACME 证书续期挑战；
#             ③ 网关自身健康检查 /healthz（负载均衡器探测，不能 301）。
#   8443/tcp  TLS 入口：全部业务流量，TLS1.2/1.3、HSTS、安全头、限流、反代。
#
# 路由：
#   /api/**  → app_backend（Bun BFF，least_conn + keepalive，含 SSE 流式）
#   /ws/**   → app_backend（WebSocket 长连接，对话流/告警推送）
#   /**      → web_frontend（前端静态站点容器，SPA、强缓存由其内部配置负责）
#
# 配套片段（构建时复制进镜像）：
#   conf.d/01-upstreams.conf   上游集群、WebSocket 映射（http 上下文）
#   conf.d/02-ratelimits.conf  全局限流/登录限流/对话限流/并发连接区
#   conf.d/03-realip.conf      真实客户端 IP 还原
#   snippets/ssl-common.conf        TLS 协议/套件/会话/OCSP（server 上下文）
#   snippets/security-headers.conf  浏览器安全响应头
#   snippets/proxy-api.conf         反代通用头/超时/故障转移
# ============================================================================

# 非 root（uid=101）运行：pid 放到可写的 /tmp。
pid       /tmp/nginx.pid;

# worker 数按容器可见 CPU 自动分配；非特权镜像默认用户即 101，无需 user 指令。
worker_processes auto;

# 网关是关键入口，错误日志打 info 以上到 stderr（限流 warn 也会在此输出）。
error_log  /dev/stderr info;

events {
    use epoll;
    # 网关承载全站并发，单 worker 连接数提高到 65535（需配合容器 nofile ulimit）。
    worker_connections 65535;
    multi_accept on;
}

http {
    # ------------------------------------------------------------------------
    # MIME 与非 root 临时目录
    # ------------------------------------------------------------------------
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # ------------------------------------------------------------------------
    # JSON 访问日志：字段含 trace_id（=X-Request-Id）、限流状态、上游耗时，
    # 直接输出到 stdout，由容器日志驱动采集到 ELK（compose 中的 es/kibana）。
    # ------------------------------------------------------------------------
    log_format json_edge escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"trace_id":"$request_id",'
            '"remote_addr":"$remote_addr",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"method":"$request_method",'
            '"scheme":"$scheme",'
            '"host":"$host",'
            '"uri":"$request_uri",'
            '"server_name":"$server_name",'
            '"status":$status,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_response_time":"$upstream_response_time",'
            '"request_time":$request_time,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_length":$request_length,'
            '"limit_req_status":"$limit_req_status",'
            '"limit_conn_status":"$limit_conn_status",'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent"'
        '}';
    access_log /dev/stdout json_edge;

    # ------------------------------------------------------------------------
    # 基础传输调优
    # ------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;            # 不暴露 nginx 版本
    types_hash_max_size 2048;
    merge_slashes   off;           # 医疗系统部分接口路径含双斜杠语义，不合并

    keepalive_timeout  65s;
    keepalive_requests 1000;

    # 对外入口请求体上限与前端容器对齐（病历附件/影像报告上传）。
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    client_header_timeout 15s;
    client_body_timeout   120s;
    send_timeout          30s;

    # 大数量表头（多级代理后 XFF 较长），并允许较长 URL（查询参数复杂）。
    large_client_header_buffers 4 16k;
    http2_max_concurrent_streams 128;

    # ------------------------------------------------------------------------
    # gzip（边缘统一压缩，后端/前端容器内压缩可保留，双端一致不冲突）
    # ------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss application/wasm
        image/svg+xml;

    # ------------------------------------------------------------------------
    # 加载 http 上下文片段：上游 / 限流区 / 真实 IP
    # ------------------------------------------------------------------------
    include /etc/nginx/conf.d/01-upstreams.conf;
    include /etc/nginx/conf.d/02-ratelimits.conf;
    include /etc/nginx/conf.d/03-realip.conf;

    # ========================================================================
    # 明文 8080 端口：健康检查 + ACME 挑战 + 全站跳转 HTTPS
    # ========================================================================
    server {
        listen      8080 default_server;
        listen      [::]:8080 default_server;
        server_name _;

        # 网关自身存活探针：SLB/K8s 与 compose healthcheck 探测，必须直接 200。
        location = /healthz {
            access_log off;
            log_not_found off;
            default_type text/plain;
            return 200 'ok\n';
        }

        # Let's Encrypt / ACME HTTP-01 挑战目录（证书续期时由 certbot 挂载）。
        # 该路径必须保持明文可达，不能跳转。
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        # 其余请求永久（301）跳转到 HTTPS，保留原始主机与 URI/查询串。
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================================================
    # TLS 8443 端口：全部业务流量
    # ========================================================================
    server {
        listen      8443 ssl default_server;
        listen      [::]:8443 ssl default_server;
        http2       on;
        server_name _;

        # TLS 协议/套件/会话复用/OCSP stapling（证书路径见片段内注释）。
        include /etc/nginx/snippets/ssl-common.conf;

        # 浏览器安全响应头（本 server 级下发；含 add_header 的子 location 需另行 include）。
        include /etc/nginx/snippets/security-headers.conf;

        # 网关 TLS 侧健康探针：自签证书场景探针用 http 8080，
        # 此处保留 https 健康端点供带证书校验的外部 LB 使用。
        location = /healthz {
            access_log off;
            log_not_found off;
            default_type text/plain;
            return 200 'ok\n';
        }

        # --------------------------------------------------------------------
        # 登录/登出/令牌刷新等鉴权入口：最严格限流（5 req/min/IP，突发 5 个）
        # nodelay 表示突发请求不排队、立即处理，超出直接返回 429。
        # --------------------------------------------------------------------
        location ~ ^/api/v1/auth/(login|logout|refresh|register|forgot-password|reset-password) {
            limit_req zone=req_login burst=5 nodelay;
            limit_conn conn_per_ip 20;

            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-api.conf;

            # 登录是短连接请求，读写超时保持紧凑。
            proxy_send_timeout   30s;
            proxy_read_timeout   30s;
            proxy_pass http://app_backend;
        }

        # --------------------------------------------------------------------
        # AI 对话接口：独立限流 + 长超时（SSE 流式），日志单独标记便于成本分析。
        # --------------------------------------------------------------------
        location ~ ^/api/v1/(chat|agent|stream)(/|$) {
            limit_req zone=req_chat burst=10 nodelay;
            limit_conn conn_per_ip 20;

            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-api.conf;

            proxy_send_timeout   300s;
            proxy_read_timeout   600s;   # 单次对话最长 10 分钟
            proxy_pass http://app_backend;
        }

        # --------------------------------------------------------------------
        # 其余 REST API：全局限流（20 req/s/IP，突发 40 个排队平滑处理）。
        # burst 给页面加载时的并发突发留余量；nodelay 让突发立即通过。
        # --------------------------------------------------------------------
        location /api/ {
            limit_req zone=req_general burst=40 nodelay;
            limit_conn conn_per_ip 50;

            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-api.conf;

            proxy_send_timeout   60s;
            proxy_read_timeout   120s;
            proxy_pass http://app_backend;
        }

        # --------------------------------------------------------------------
        # WebSocket：/ws/** 长连接，仅做全局限流，超时拉长到 1 小时，
        # 由应用层心跳（ping/pong）判断死活。
        # --------------------------------------------------------------------
        location /ws/ {
            limit_req zone=req_general burst=20 nodelay;
            limit_conn conn_per_ip 30;

            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-api.conf;

            proxy_read_timeout   3600s;
            proxy_send_timeout   3600s;
            proxy_pass http://app_backend;
        }

        # --------------------------------------------------------------------
        # 前端静态站点：其余所有路径交给 web 容器（SPA/缓存策略在其内部生效）。
        # 全局限流，静态请求失败时故障转移到下一个 web 副本。
        # --------------------------------------------------------------------
        location / {
            limit_req zone=req_general burst=60 nodelay;
            limit_conn conn_per_ip 50;

            include /etc/nginx/snippets/security-headers.conf;

            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_next_upstream   error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_pass http://web_frontend;
        }
    }
}
