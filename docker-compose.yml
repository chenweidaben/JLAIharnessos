# ============================================================================
# 健澜科技杠OS（数智医院智能体）— 全栈容器编排（基础/开发联调档）
# ----------------------------------------------------------------------------
# 服务拓扑：
#   nginx（边缘网关，唯一对外入口）
#     ├─ web（前端静态站点，React19+Vite 产物，frontend 网络）
#     └─ app（后端 BFF，Bun，backend 网络）
#          ├─ postgres（PostgreSQL 16，业务主库）
#          ├─ redis（Redis 7，缓存/锁/限流/会话）
#          ├─ kafka（Bitnami KRaft 单节点，消息总线，无 zookeeper）
#          └─ jaeger（链路追踪）
#   monitoring 网络：prometheus / grafana / elasticsearch / kibana / jaeger
#
# 网络分层（最小访问面）：
#   frontend   边缘 ↔ 前端
#   backend    边缘/应用 ↔ 数据库/缓存/消息（不对网关之外暴露）
#   monitoring 监控/日志组件互通；prometheus 同时接入 backend 以便抓取应用指标
#
# 使用方式：
#   1) cp .env.compose.example .env  并修改其中所有口令/密钥（占位符必须替换）；
#   2) docker compose build；
#   3) docker compose up -d；
#   4) 访问 https://localhost（边缘自签开发证书，浏览器会告警，仅限自测）。
# 生产部署请叠加覆盖文件：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 约定：
#   - 所有镜像固定具体版本 tag，严禁 latest；
#   - 每个有状态/业务服务均配置 healthcheck 与 depends_on(condition)；
#   - 密钥只从 .env 插值（${VAR:?错误提示}），仓库内只有占位符；
#   - 基础设施管理端口仅绑定宿主机回环 127.0.0.1，不对局域网/公网开放。
# ============================================================================

name: jianlan-gangos

services:
  # ==========================================================================
  # 后端 BFF（Bun 运行时，镜像由根 Dockerfile.backend 构建）
  # ==========================================================================
  app:
    image: registry.jianlan.tech/jianlan/backend:${APP_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: Dockerfile.backend
    # 环境变量：非敏感项给默认值，敏感项（口令/密钥）缺失即拒绝启动。
    environment:
      NODE_ENV: production
      BUN_ENV: production
      APP_ENV: ${APP_ENV:-prod}
      HTTP_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 数据库连接串（PostgreSQL 16，账号库名来自 .env）。
      DATABASE_URL: postgres://${POSTGRES_USER:?请在 .env 中设置 POSTGRES_USER}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?请在 .env 中设置 POSTGRES_DB}?schema=public
      # Redis 连接串（走 backend 内网，密码鉴权）。
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/0
      # Kafka bootstrap（KRaft 单节点，PLAINTEXT 仅限内网）。
      KAFKA_BROKERS: kafka:9092
      # 安全密钥（JWT 签名/字段加密主密钥），由部署环境注入。
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?请在 .env 中设置 ENCRYPTION_MASTER_KEY}
      # OpenTelemetry：将链路数据以 OTLP/gRPC?http 发送到 jaeger collector。
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: jianlan-bff
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    # 就绪探针：/ready 会检查数据库/Redis 等关键依赖，未就绪时返回非 2xx。
    healthcheck:
      test: ["CMD", "bun", "scripts/docker/healthcheck.ts", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # 仅绑定宿主机回环，便于本机直连调试；对外统一走 nginx 443。
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================================================
  # 前端 Web（nginx 托管 Vite 静态产物，镜像由 web/Dockerfile.frontend 构建）
  # ==========================================================================
  web:
    image: registry.jianlan.tech/jianlan/web:${APP_VERSION:-0.1.0}
    build:
      context: web
      dockerfile: Dockerfile.frontend
      args:
        # 同源部署：前端通过边缘网关同域访问 /api/v1 与 /ws。
        VITE_API_BASE_URL: /api/v1
        VITE_WS_URL: /ws
        VITE_APP_ENV: production
    depends_on:
      app:
        condition: service_started
    networks:
      - frontend
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # PostgreSQL 16（业务主库）
  #   - 首次启动自动按文件名顺序执行 deploy/postgres/init/*.sql；
  #   - 使用定制 postgresql.conf（生产调优 + WAL 归档 + 审计日志参数）；
  #   - 入口先确保 WAL 归档目录属主正确，再交给官方 entrypoint（随后降权 postgres）。
  # ==========================================================================
  postgres:
    image: postgres:16.4-alpine3.20
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 中设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 中设置 POSTGRES_DB}
      TZ: Asia/Shanghai
    # 官方镜像入口以 root 初始化后通过 gosu 降权为 postgres(uid=70)，
    # 业务进程为非 root；install 先把归档目录授权给 postgres。
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        install -d -o postgres -g postgres -m 0700 /wal-archive
        exec /usr/local/bin/docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pg-wal-archive:/wal-archive
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./deploy/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # pg_isready 仅接受正确账号/库的连接才返回 0；$$ 转义使变量在容器内展开。
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ==========================================================================
  # Redis 7（缓存/分布式锁/限流/会话黑名单）
  #   - 定制 redis.conf（maxmemory+LRU、AOF everysec、危险命令改名等）；
  #   - 密码通过 --requirepass 在启动命令注入（镜像/配置文件内不固化口令）。
  # ==========================================================================
  redis:
    image: redis:7.4.0-alpine3.20
    # $$ 转义：compose 不做插值，交由容器内 sh 从容器环境变量展开 REDIS_PASSWORD。
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # Kafka（Bitnami，KRaft 模式单节点，内置 controller，不再依赖 zookeeper）
  # ==========================================================================
  kafka:
    image: bitnami/kafka:3.8.0-debian-12-r0
    environment:
      TZ: Asia/Shanghai
      # KRaft：单节点同时承担 controller 与 broker 角色。
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      # 9092=客户端 PLAINTEXT（仅内网）；9093=controller 间通信。
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # 单节点副本因子与最小 ISR 调为 1（仅适合单节点；扩容为集群时必须调回 3）。
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka/data
    networks:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    healthcheck:
      # 通过列出 topic 验证 broker 已就绪（依赖客户端工具，镜像自带）。
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================================================
  # 边缘网关（唯一对外入口；80→8080 明文跳转，443→8443 TLS 业务）
  # ==========================================================================
  nginx:
    image: registry.jianlan.tech/jianlan/nginx-edge:${APP_VERSION:-0.1.0}
    build:
      context: deploy/nginx
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ==========================================================================
  # Prometheus（指标采集与告警评估）
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend
      - monitoring
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # Grafana（可视化看板；数据源自动装配，禁止自助注册）
  # ==========================================================================
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请在 .env 中设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - monitoring
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # Elasticsearch（单节点日志存储；开启安全认证，锁定内存）
  # ==========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      TZ: Asia/Shanghai
      cluster.name: jianlan-logs
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.transport.ssl.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ES_PASSWORD:?请在 .env 中设置 ES_PASSWORD}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      # 单节点不走 ILM 自动扩缩；禁止通配符删除索引，防误操作。
      action.destructive_requires_name: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - monitoring
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"elastic:$${ELASTIC_PASSWORD}\" http://127.0.0.1:9200/_cluster/health?local=true"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================================================
  # Kibana（日志检索与分析 UI）
  # ==========================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      TZ: Asia/Shanghai
      SERVER_NAME: jianlan-kibana
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ES_PASSWORD:?请在 .env 中设置 ES_PASSWORD}
      # 仅内网访问，不对外暴露 onboarding 引导遥测。
      TELEMETRY_ENABLED: "false"
      XPACK_SECURITY_ENROLLMENT_ENABLED: "false"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - monitoring
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    healthcheck:
      # /api/status 在核心服务就绪后返回 200，启动期返回 503。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # Jaeger all-in-one（链路追踪：collector/query/agent 一体，badger 持久化）
  # ==========================================================================
  jaeger:
    image: registry.jianlan.tech/jianlan/jaeger-all-in-one:1.60.0
    build:
      context: deploy/observability
      dockerfile: Dockerfile.jaeger
    environment:
      TZ: Asia/Shanghai
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
      # 开启 OTLP（gRPC 4317 / HTTP 4318）接收，供应用 SDK 上报。
      COLLECTOR_OTLP_ENABLED: "true"
      # 采样率：开发期全采样（1=100%），生产在 prod 覆盖文件中调低。
      SAMPLING_TYPES: const
      SAMPLING_PARAM: "1"
    volumes:
      - jaeger-badger:/badger
    networks:
      - backend
      - monitoring
    restart: unless-stopped
    ports:
      # 16686=查询 UI；仅绑定回环。OTLP 4317/4318 不发布宿主机，仅内网可达。
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"
    healthcheck:
      test: ["/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:16686/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

# ==========================================================================
# 命名卷：有状态数据全部落在 Docker 托管卷，便于备份/迁移，绝不写入容器层。
# ==========================================================================
volumes:
  pg-data:
    name: jianlan-pg-data
  pg-wal-archive:
    name: jianlan-pg-wal-archive
  redis-data:
    name: jianlan-redis-data
  kafka-data:
    name: jianlan-kafka-data
  es-data:
    name: jianlan-es-data
  prometheus-data:
    name: jianlan-prometheus-data
  grafana-data:
    name: jianlan-grafana-data
  jaeger-badger:
    name: jianlan-jaeger-badger

# ==========================================================================
# 网络：frontend / backend / monitoring 三层桥接网络，默认不开启 internal
# （app 需要访问外网大模型 API；数据库等敏感服务不加入 frontend 即不可被网关直达）。
# ==========================================================================
networks:
  frontend:
    name: jianlan-frontend
    driver: bridge
  backend:
    name: jianlan-backend
    driver: bridge
  monitoring:
    name: jianlan-monitoring
    driver: bridge
