name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate index page
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>JLAIharnessos - 健澜科技杠OS 文档中心</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #062a4a; color: #e0e0e0; line-height: 1.6; }
              .header { background: linear-gradient(135deg, #0A4D8C, #062a4a); padding: 60px 20px; text-align: center; border-bottom: 3px solid #1a73e8; }
              .header h1 { font-size: 2.5em; color: #fff; margin-bottom: 10px; }
              .header p { font-size: 1.2em; color: #a0c4e8; }
              .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
              .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
              .card { background: #0d3b66; border-radius: 12px; padding: 24px; border: 1px solid #1a5a8a; transition: transform 0.2s; }
              .card:hover { transform: translateY(-4px); border-color: #1a73e8; }
              .card h3 { color: #4fc3f7; margin-bottom: 12px; font-size: 1.2em; }
              .card ul { list-style: none; }
              .card li { margin: 8px 0; }
              .card a { color: #90caf9; text-decoration: none; }
              .card a:hover { text-decoration: underline; color: #4fc3f7; }
              .footer { text-align: center; padding: 40px 20px; color: #607d8b; border-top: 1px solid #1a5a8a; margin-top: 60px; }
              .badge { display: inline-block; background: #1a73e8; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.85em; margin: 4px; }
            </style>
          </head>
          <body>
            <div class="header">
              <h1>JLAIharnessos</h1>
              <p>健澜科技杠OS · 数智医院工业级智能体操作系统</p>
              <div style="margin-top: 16px;">
                <span class="badge">Apache-2.0</span>
                <span class="badge">医疗AI</span>
                <span class="badge">智能体OS</span>
                <span class="badge">低代码</span>
              </div>
            </div>
            <div class="container">
              <h2 style="color: #4fc3f7; margin-bottom: 10px;">📚 文档中心</h2>
              <p>杭州健澜科技 · 让医疗AI更简单更落地</p>
              <div class="grid">
                <div class="card">
                  <h3>🏗️ 架构设计</h3>
                  <ul>
                    <li><a href="architecture/">架构审计报告</a></li>
                    <li><a href="technical/01-系统总体架构设计.md">系统总体架构设计</a></li>
                    <li><a href="technical/02-Agent能力与医疗工具设计.md">Agent能力与医疗工具</a></li>
                  </ul>
                </div>
                <div class="card">
                  <h3>📋 需求与产品</h3>
                  <ul>
                    <li><a href="requirements/">产品需求规格</a></li>
                    <li><a href="requirements/全诊产品需求规格说明书.md">全诊产品需求规格</a></li>
                    <li><a href="requirements/智能体应用功能映射.md">智能体功能映射</a></li>
                  </ul>
                </div>
                <div class="card">
                  <h3>🔧 技术文档</h3>
                  <ul>
                    <li><a href="technical/00-开发规范与代码规范.md">开发规范</a></li>
                    <li><a href="technical/03-数据模型与知识库设计.md">数据模型与知识库</a></li>
                    <li><a href="technical/04-安全合规与系统集成设计.md">安全合规与集成</a></li>
                  </ul>
                </div>
                <div class="card">
                  <h3>🚀 部署与运维</h3>
                  <ul>
                    <li><a href="deployment/">部署文档</a></li>
                    <li><a href="operations/">运维手册</a></li>
                    <li><a href="engineering/">工程化文档</a></li>
                  </ul>
                </div>
                <div class="card">
                  <h3>🧪 测试与质量</h3>
                  <ul>
                    <li><a href="testing/">测试策略</a></li>
                    <li><a href="testing/医疗场景验收用例.md">医疗场景验收</a></li>
                    <li><a href="testing/安全测试用例.md">安全测试</a></li>
                  </ul>
                </div>
                <div class="card">
                  <h3>📖 API 参考</h3>
                  <ul>
                    <li><a href="api/">API文档</a></li>
                    <li><a href="adr/">架构决策记录</a></li>
                    <li><a href="open-source/">开源贡献指南</a></li>
                  </ul>
                </div>
              </div>
            </div>
            <div class="footer">
              <p>© 2026 杭州健澜科技 · JLAIharnessos · 让医疗AI更简单更落地</p>
              <p style="margin-top: 8px;">Apache License 2.0 · 开源贡献者共建</p>
            </div>
          </body>
          </html>
          EOF
          echo "index.html generated"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
