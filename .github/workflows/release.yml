# 触发：推送 v* 形式的 Git Tag（如 v0.2.0）
# 产物：生产构建 + 变更日志 + GitHub Release

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（如 v0.2.0）'
        required: true

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: bun install --frozen-lockfile || npm ci

      - name: 类型检查与 Lint
        run: |
          bun run typecheck
          bun run lint:ci

      - name: 运行测试
        run: bun test

      - name: 生产构建
        run: bun run build

      - name: 生成变更日志
        id: changelog
        run: |
          TAG=${{ github.event.inputs.tag || github.ref_name }}
          PREV_TAG=$(git describe --tags --abbrev=0 ${TAG}^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG".."$TAG" --pretty=format:"- %s (%h)" > CHANGELOG.md
          else
            git log "$TAG" --pretty=format:"- %s (%h)" > CHANGELOG.md
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          cat CHANGELOG.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 健澜科技杠OS ${{ github.event.inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            dist/
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
