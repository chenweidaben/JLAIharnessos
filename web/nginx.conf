# ============================================================================
# 健澜科技杠OS — 前端容器 Nginx 完整配置（web/Dockerfile.frontend 运行时）
# ----------------------------------------------------------------------------
# 设计目标：
#   1. 纯静态托管 React 19 + Vite 构建产物（/usr/share/nginx/html）；
#   2. 带内容哈希的静态资源永久强缓存，index.html 禁止缓存（保证发版即时生效）；
#   3. SPA history 路由回退（try_files → /index.html）；
#   4. 输出浏览器安全响应头；
#   5. /api、/ws 反向代理到后端 BFF 服务（compose 中服务名为 app:8080），
#      支持 WebSocket 升级与会话保持；
#   6. 访问日志采用 JSON 格式并携带请求唯一标识 request_id，便于日志平台采集排障；
#   7. 以非 root 用户（uid=101）运行：监听 8080、pid 与临时目录全部置于 /tmp。
#
# 注：本文件是「完整主配置」（含 main/events/http 上下文），直接覆盖镜像内
#     /etc/nginx/nginx.conf，而非 conf.d 下的 server 片段。
# ============================================================================

# 以非 root 运行时，/run/nginx.pid 不可写，pid 文件放到 /tmp。
pid       /tmp/nginx.pid;

# worker 进程数：auto 按容器可见 CPU 核数自动分配；
# 容器限额（cpus）下 nginx 能正确识别 cgroup 配额。
worker_processes auto;

# 仅错误日志输出到 stderr（docker logs 可采集），warn 级别避免噪音。
error_log  /dev/stderr warn;

# 事件模型：Linux 下使用 epoll；worker_connections 为单 worker 最大连接数，
# 静态站点 + 反代场景 10240 足够，必要时随系统 ulimit 调整。
events {
    use epoll;
    worker_connections 10240;
    # 一个工作进程可同时接受多个新连接，缓解突发接入时的握手延迟。
    multi_accept on;
}

http {
    # ------------------------------------------------------------------------
    # 基础 MIME 与临时目录（非 root 运行必须指向可写的 /tmp）
    # ------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 官方镜像默认临时目录在 /var/cache/nginx（root 所有），非 root 不可写，
    # 统一切到 /tmp 下的独立子目录，nginx 启动时会自行创建。
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # ------------------------------------------------------------------------
    # JSON 访问日志（含请求唯一标识，等价于 trace_id）
    # ------------------------------------------------------------------------
    # $request_id 由 nginx 为每个请求生成 16 字节十六进制 UUID（版本4样式），
    # 反代时通过 X-Request-Id 透传给后端，实现前后端日志串联。
    log_format json_main escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"trace_id":"$request_id",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"upstream_status":"$upstream_status",'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent"'
        '}';

    # 访问日志输出到 stdout，交由容器运行时统一收集（docker logs / 日志驱动）。
    access_log /dev/stdout json_main;

    # ------------------------------------------------------------------------
    # 传输与连接优化
    # ------------------------------------------------------------------------
    sendfile        on;   # 零拷贝发送静态文件
    tcp_nopush      on;   # 攒包发送响应头与大文件，提升吞吐
    tcp_nodelay     on;   # 小请求即时发送，降低交互延迟（keepalive 下生效）
    server_tokens   off;  # 响应头与错误页不暴露 nginx 版本，收敛攻击面
    types_hash_max_size 2048;

    # 保持连接参数：服务端 65 秒空闲超时（略小于客户端常见 70 秒，避免竞态），
    # 每连接最多复用 1000 个请求后优雅关闭，防止长连接资源长期占用。
    keepalive_timeout  65s;
    keepalive_requests 1000;

    # 客户端请求体上限：前端主要上传病历附件/图片，50m 与后端 BFF 限制对齐。
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    client_header_timeout 15s;
    client_body_timeout   60s;
    send_timeout          30s;

    # ------------------------------------------------------------------------
    # gzip 压缩
    # ------------------------------------------------------------------------
    gzip               on;
    gzip_vary          on;     # 增加 Vary: Accept-Encoding，兼容缓存层
    gzip_proxied       any;    # 无论反代响应是否带缓存头都压缩
    gzip_comp_level    5;      # 压缩率与 CPU 的平衡点（静态资源发版时压缩）
    gzip_min_length    1024;   # 小于 1KB 不压缩，避免微小响应反而膨胀
    gzip_buffers       16 8k;
    gzip_http_version  1.1;
    # 文本/JSON/JS/CSS/SVG 等可压缩类型；图片/字体/视频本身已压缩，不再 gzip。
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        application/rss+xml application/wasm
        font/ttf font/otf
        image/svg+xml;

    # ------------------------------------------------------------------------
    # WebSocket 升级映射（map 放在 http 上下文）
    # ------------------------------------------------------------------------
    # 仅当客户端请求为 Upgrade 时才设置 connection=upgrade，
    # 普通 HTTP 请求保持 keep-alive，避免无谓的连接升级。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # 上游后端 BFF：compose 网络内服务名 app、端口 8080。
    # 这里不做负载均衡（多实例由边缘网关 deploy/nginx 负责），
    # keepalive 保持到 BFF 的长连接池，降低频繁建连开销。
    upstream bff_upstream {
        server app:8080 max_fails=3 fail_timeout=15s;
        keepalive 64;
    }

    # ------------------------------------------------------------------------
    # 唯一 server（监听非特权端口 8080，供非 root 用户运行）
    # ------------------------------------------------------------------------
    server {
        listen       8080 default_server;
        listen       [::]:8080 default_server;
        server_name  _;

        # 站点根目录（Vite 产物）与默认首页。
        root   /usr/share/nginx/html;
        index  index.html;

        # ---------- 浏览器安全响应头（边缘网关会再下发一份，双层防御）----------
        # 只信任同源与内联资源（Vite 产物）；如未来引入 CDN/统计脚本需在此显式放行。
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        # 禁止页面被任意站点 iframe 嵌套（防点击劫持）。
        add_header X-Frame-Options "SAMEORIGIN" always;
        # 浏览器禁止对响应做 MIME 类型嗅探。
        add_header X-Content-Type-Options "nosniff" always;
        # 仅同源发送 Referer，且 HTTPS→HTTP 降级时不带 referer。
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # 禁用不必要的浏览器能力（摄像头/麦克风/地理位置/支付），最小授权。
        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        # 关闭 XSS Auditor（现代浏览器已废弃，统一交由 CSP 防护）。
        add_header X-XSS-Protection "1; mode=block" always;
        # 前端为纯静态、同源反代，不允许跨域加载本资源的展示。
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # 把请求唯一标识回写给客户端并透传后端，便于工单级排障。
        add_header X-Request-Id $request_id always;

        # ---------- 容器健康检查专用端点（不打访问日志，不进 SPA 回退）----------
        location = /healthz {
            access_log off;
            log_not_found off;
            default_type text/plain;
            return 200 'ok\n';
        }

        # ---------- REST API 反向代理到 BFF ----------
        # 同时覆盖 /api（同源便捷路径）与 /api/v1（BFF 统一前缀）。
        location /api/ {
            # 透传协议/主机/真实客户端 IP（边缘网关之后还有 X-Forwarded-* 链）。
            proxy_pass         http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $request_id;
            # WebSocket 升级支持（/api 下若存在流式升级接口也可复用）。
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            # 代理超时：BFF 对话流式接口可能长时间返回，读超时放宽到 10 分钟。
            proxy_connect_timeout 5s;
            proxy_send_timeout    300s;
            proxy_read_timeout    600s;
            # SSE/流式响应不缓冲，token 实时到达前端。
            proxy_buffering    off;
            proxy_cache        off;
            # 允许更大的请求体（病历附件上传）。
            client_max_body_size 50m;
        }

        # ---------- WebSocket 专用路径（/ws/chat 对话流与告警推送）----------
        location /ws/ {
            proxy_pass         http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $request_id;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            # WebSocket 为长连接：读写空闲超时设为 1 小时，由应用层心跳保活。
            proxy_connect_timeout 5s;
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_buffering       off;
        }

        # ---------- 带哈希的静态构建资源：永久强缓存 ----------
        # Vite 构建产物位于 /assets/，文件名带内容哈希，内容变更即换名，
        # 因此可安全地 immutable 缓存 1 年，发版后 HTML 引用新文件名自动失效。
        location /assets/ {
            access_log off;                 # 静态资源不打访问日志，降低噪音
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            # 安全头在 expires 场景仍需保留（add_header 继承会被覆盖，故显式补关键头）。
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # ---------- index.html：禁止缓存 ----------
        # 入口 HTML 引用带哈希的资源；一旦缓存 HTML，发版后用户将停留旧版本。
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
        }

        # favicon、站点图标等根级静态文件：短缓存，避免图标更新不生效。
        location ~* ^/favicon(\.ico)?$ {
            access_log off;
            expires 1h;
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri =404;
        }

        # ---------- SPA history 路由回退 ----------
        # 任何找不到的非文件路径都回退到 /index.html，由前端路由处理；
        # 确属不存在的真实文件（如 /assets 下哈希文件）上面已直接 404。
        location / {
            # 静态文件存在则直接返回，否则回退首页；$is_args$args 保留查询串。
            try_files $uri $uri/ /index.html$is_args$args;
        }

        # ---------- 自定义错误页也走 SPA（由前端渲染统一错误界面）----------
        error_page 404 /index.html;
    }
}
