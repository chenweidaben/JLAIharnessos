management:
  endpoints:
    web:
      exposure:
        # 生产环境接 Prometheus + Grafana 监控
        include: health,info,prometheus,metrics,env

logging:
  level:
    root: INFO
    com.jlmedaios: DEBUG

# JWT 配置（P0 安全止血）
jlmedaios:
  security:
    jwt:
      secret: jlmedaios-dev-secret-key-change-in-production-32bytes
      # token 有效期 24h
      expiration: 86400000
