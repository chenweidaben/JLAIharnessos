server:
  port: 9090

spring:
  application:
    name: jlmedaios-monolith
  datasource:
    # H2 内存库，DB_CLOSE_DELAY=-1 保持 JVM 期间不销毁
    url: jdbc:h2:mem:monolith;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

# 生产环境切换 PostgreSQL 16:
#   spring.datasource.url=jdbc:postgresql://localhost:5432/monolith
#   spring.datasource.username=postgres
#   spring.datasource.password=***
#   spring.datasource.driver-class-name=org.postgresql.Driver
# 后续可切达梦信创：
#   spring.datasource.url=jdbc:dm://localhost:5236/monolith
#   spring.datasource.driver-class-name=dm.jdbc.driver.DmDriver

management:
  endpoints:
    web:
      exposure:
        include: health,info
