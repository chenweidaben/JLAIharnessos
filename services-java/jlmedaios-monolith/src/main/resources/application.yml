server:
  port: 9090

spring:
  application:
    name: jlmedaios-os
  datasource:
    # P3 生产化：主数据源切换 PostgreSQL 16
    url: jdbc:postgresql://localhost:5433/jlmedaios
    driver-class-name: org.postgresql.Driver
    username: postgres
    password:
    # HikariCP 连接池调优（P1 性能优化）
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    # P3 生产化：PostgreSQL 方言
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  # encounter_record 表由 JPA 自动创建，append-only 约束由业务层保证
  h2:
    console:
      # P0 安全止血：生产环境关闭 H2 Console
      enabled: false
      path: /h2-console
  # H2 启动自动执行 schema.sql + data.sql
  sql:
    init:
      mode: always
  # Flyway 迁移（P2 阶段开启，H2 也兼容）
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # Redis 缓存配置（P2 骨架）
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000
  jackson:
    time-zone: Asia/Shanghai

# 生产环境切换 PostgreSQL 16:
