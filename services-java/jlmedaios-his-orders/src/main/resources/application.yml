server:
  port: 9103

spring:
  application:
    name: jlmedaios-his-orders
  datasource:
    # PostgreSQL 16 基线：部署环境经 SPRING_DATASOURCE_URL/USERNAME/PASSWORD 覆盖；
    # 本地无 PG 时可回退 H2 内存库（切换 driver-class-name 与 url 即可）。
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jlmedaios}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      # 安全止血：默认关闭 H2 Console
      enabled: false
      path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
